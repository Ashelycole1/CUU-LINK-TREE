name: event_tree
description: "Event Tree for Android and iOS."
publish_to: 'none'
version: 0.1.0+1

# Flutter 3.47.8 stable, pinned in .fvmrc. Phase-1 packages only (plan §2).
environment:
  sdk: ^3.13.7
  flutter: 3.47.8

dependencies:
  add_2_calendar: ^3.1.1
  cached_network_image: ^4.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^23.0.3
  flutter_riverpod: ^3.5.0
  # Part of the Flutter SDK (not pub.dev): path URLs on web, see bootstrap.dart.
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.3
  posthog_flutter: ^5.61.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled, never downloaded at runtime (plan §1). Figtree is the app
  # font, as on the web. Bricolage Grotesque and Fraunces (host pages)
  # arrive with page_theme.dart in phase 2.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
