# Render Blueprint: one web service that serves the API and the web app on the same origin.
# The database is Neon (serverless Postgres): https://neon.tech
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render then asks for:
#   DATABASE_URL           pooled Neon connection string  } both are in .env.local after
#   DATABASE_URL_UNPOOLED  direct Neon connection string  } `neon deploy` / `neon env pull`
#   NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL                     Neon Auth (sign-in)
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION   Neon Object Storage
#   PUBLIC_URL    the https:// address people visit, e.g. https://event-tree.onrender.com
# Copy the Neon values from the production branch's .env.local (never commit them).
# Before the first sign-in, trust the address in Neon Auth:  neon neon-auth domain add <PUBLIC_URL>
# Tables are created on first start.
services:
  - type: web
    name: event-tree
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: PUBLIC_URL
        sync: false
